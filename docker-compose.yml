version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# ShipKit — Docker Compose
#
# Starts: PostgreSQL database + ShipKit API/frontend
#
# Quick start:
#   1. cp .env.example .env && edit .env
#   2. docker compose up --build
#   3. Run DB migrations: docker compose exec api node ./dist/index.mjs db:migrate
#      (or use pnpm --filter @workspace/db run push outside Docker)
#   4. Open http://localhost:5000
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shipkit
      POSTGRES_USER: shipkit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipkit -d shipkit"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── ShipKit API + Frontend ───────────────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://shipkit:${POSTGRES_PASSWORD:-changeme}@db:5432/shipkit
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      STATIC_DIR: /app/dashboard-dist
      SHIPKIT_BUILD_DIR: /app/build-workspace
      # Optional — set these to enable GitHub sync without Replit integration
      SHIPKIT_GITHUB_TOKEN: ${SHIPKIT_GITHUB_TOKEN:-}
      SHIPKIT_GITHUB_WEBHOOK_SECRET: ${SHIPKIT_GITHUB_WEBHOOK_SECRET:-}
      # Optional — global EAS / App Store credentials (can also be set per-pipeline)
      SHIPKIT_EAS_TOKEN: ${SHIPKIT_EAS_TOKEN:-}
      SHIPKIT_APP_STORE_KEY_ID: ${SHIPKIT_APP_STORE_KEY_ID:-}
      SHIPKIT_APP_STORE_ISSUER_ID: ${SHIPKIT_APP_STORE_ISSUER_ID:-}
      SHIPKIT_APP_STORE_PRIVATE_KEY: ${SHIPKIT_APP_STORE_PRIVATE_KEY:-}
    volumes:
      # Persist uploaded zip sources and EAS build artifacts across restarts
      - build_workspace:/app/build-workspace

volumes:
  postgres_data:
  build_workspace:
